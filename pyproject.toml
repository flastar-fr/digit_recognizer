[project]
name = "digit-recognizer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[tool.uv.sources]
torch = { index = "cu124" }
torchvision = { index = "cu124" }

[[tool.uv.index]]
name = "cu124"
url = "https://download.pytorch.org/whl/cu124"
